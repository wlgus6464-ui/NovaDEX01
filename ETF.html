<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaDEX - ETF</title>
    <style>
        :root {
            --bg: #090B11;
            --sidebar: #0F141D;
            --panel: #141B26;
            --border: #232B38;
            --primary: #7CFF6B;
            --danger: #FF5A73;
        }
        body {
            margin: 0;
            background: var(--bg);
            color: white;
            font-family: system-ui, sans-serif;
        }
        .glass {
            background: rgba(20,27,38,0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 18px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 24px;
            color: #aaa;
            text-decoration: none;
            transition: all 0.25s ease;
        }
        .nav-item:hover {
            color: var(--primary);
            background: rgba(124,255,107,0.12);
            transform: translateX(6px);
        }
        .nav-item.active {
            color: var(--primary);
        }
        .main {
            margin-left: 260px;
            padding: 40px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 16px 12px;
            text-align: left;
            border-bottom: 1px solid #222;
        }
        th.sortable {
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }
        th.sortable:hover {
            color: var(--primary);
        }
        th.sortable.active {
            color: var(--primary);
        }
        tr:hover {
            background: rgba(124,255,107,0.08);
        }
        .coin-logo {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            vertical-align: middle;
            margin-right: 12px;
        }
        .positive { color: var(--primary); }
        .negative { color: var(--danger); }
    </style>
</head>
<body>
    <aside class="glass" style="width:260px; position:fixed; height:100vh; background:var(--sidebar); padding:24px 0; border-right:1px solid #333; z-index:10;">
        <div style="padding:0 24px 40px; font-size:28px; font-weight:700; color:var(--primary);">🌟 NovaDEX</div>
        <nav>
            <a href="index.html" class="nav-item">🌟 <span>Top</span></a>
            <a href="trending.html" class="nav-item">🔥 <span>Trending</span></a>
            <a href="#" class="nav-item">🌱 <span>Most Visited</span></a>
            <a href="#" class="nav-item">💰 <span>Prediction Markets</span></a>
            <a href="news.html" class="nav-item">📰 <span>News</span></a>
            <a href="on-chain-data.html" class="nav-item">📊 <span>On-Chain Data</span></a>
            <a href="https://wlgus6464-ui.github.io/NovaDEX01/ETF.html" class="nav-item active">💵 <span>ETF (Exchange Traded Fund)</span></a>
        </nav>
    </aside>

    <div class="main">
        <h1 style="margin:0 0 30px; font-size:1.8rem;">💵 ETF (Exchange Traded Fund)</h1>
        <div class="glass" style="padding:10px;">
            <table>
                <thead>
                    <tr style="color:#aaa;">
                        <th>#</th>
                        <th class="sortable" data-sort="marketCap">Coin</th>
                        <th class="sortable" data-sort="price">Price</th>
                        <th class="sortable" data-sort="change24h">24h %</th>
                        <th class="sortable" data-sort="marketCap">ETF Market Cap</th>
                        <th class="sortable" data-sort="volume">ETF Volume (24h)</th>
                    </tr>
                </thead>
                <tbody id="etf-table"></tbody>
            </table>
        </div>
    </div>

    <script src="ETF.js"></script>
    <script>
        let sortKey = "marketCap";
        let sortDir = "desc";

        function formatPrice(n) {
            return "$" + Number(n).toLocaleString();
        }

        function formatBillions(n) {
            return "$" + (n / 1e9).toFixed(2) + "B";
        }

        function getSortedList() {
            const data = (window.etfList || []).slice();
            data.sort(function(a, b) {
                var av = a[sortKey];
                var bv = b[sortKey];
                if (av < bv) return sortDir === "desc" ? 1 : -1;
                if (av > bv) return sortDir === "desc" ? -1 : 1;
                return 0;
            });
            return data;
        }

        function renderEtfTable() {
            const tbody = document.getElementById("etf-table");
            const data = getSortedList();
            if (!data.length) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:60px; color:#888;">ETF.js를 확인해주세요</td></tr>';
                return;
            }
            tbody.innerHTML = "";
            data.forEach(function(item, i) {
                const row = document.createElement("tr");
                const cls = item.change24h > 0 ? "positive" : (item.change24h < 0 ? "negative" : "");
                row.innerHTML =
                    "<td>" + (i + 1) + "</td>" +
                    '<td style="display:flex; align-items:center;">' +
                    '<img src="' + item.image + '" class="coin-logo" alt="' + item.name + '">' +
                    item.name + " (" + item.symbol + ")" +
                    "</td>" +
                    '<td style="font-weight:600;">' + formatPrice(item.price) + "</td>" +
                    '<td class="' + cls + '">' + item.change24h + "%</td>" +
                    "<td>" + formatBillions(item.marketCap) + "</td>" +
                    "<td>" + formatBillions(item.volume) + "</td>";
                tbody.appendChild(row);
            });
        }

        document.querySelectorAll("th.sortable").forEach(function(th) {
            th.addEventListener("click", function() {
                const key = th.getAttribute("data-sort");
                if (sortKey === key) {
                    sortDir = sortDir === "desc" ? "asc" : "desc";
                } else {
                    sortKey = key;
                    sortDir = "desc";
                }
                document.querySelectorAll("th.sortable").forEach(function(h) {
                    h.classList.remove("active");
                });
                th.classList.add("active");
                renderEtfTable();
            });
        });

        window.onload = renderEtfTable;
    </script>
</body>
</html>
