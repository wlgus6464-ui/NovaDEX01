<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaDEX - ETF</title>
    <style>
        :root {
            --bg: #090B11;
            --sidebar: #0F141D;
            --panel: #141B26;
            --border: #232B38;
            --primary: #7CFF6B;
            --danger: #FF5A73;
        }
        body {
            margin: 0;
            background: var(--bg);
            color: white;
            font-family: system-ui, sans-serif;
        }
        .glass {
            background: rgba(20,27,38,0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 18px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 24px;
            color: #aaa;
            text-decoration: none;
            transition: all 0.25s ease;
        }
        .nav-item:hover {
            color: var(--primary);
            background: rgba(124,255,107,0.12);
            transform: translateX(6px);
        }
        .nav-item.active {
            color: var(--primary);
        }
        .main {
            margin-left: 260px;
            padding: 40px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        th, td {
            padding: 16px 12px;
            text-align: left;
            border-bottom: 1px solid #222;
            vertical-align: middle;
        }
        th:nth-child(1), td:nth-child(1) { width: 24%; }
        th:nth-child(2), td:nth-child(2) { width: 14%; }
        th:nth-child(3), td:nth-child(3) { width: 12%; }
        th:nth-child(4), td:nth-child(4) { width: 12%; }
        th:nth-child(5), td:nth-child(5) { width: 19%; }
        th:nth-child(6), td:nth-child(6) { width: 19%; }
        th.sortable {
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }
        th.sortable:hover {
            color: var(--primary);
        }
        th.sortable.active {
            color: var(--primary);
        }
        tr:hover {
            background: rgba(124,255,107,0.08);
        }
        .coin-logo {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            vertical-align: middle;
            margin-right: 12px;
            flex-shrink: 0;
        }
        td.coin-cell {
            white-space: nowrap;
        }
        .positive { color: var(--primary); }
        .negative { color: var(--danger); }
        tbody tr:last-child td { border-bottom: none; }
        td { font-weight: 400; }
        td.col-active { font-weight: 700; }
    </style>
</head>
<body>
    <aside class="glass" style="width:260px; position:fixed; height:100vh; background:var(--sidebar); padding:24px 0; border-right:1px solid #333; z-index:10;">
        <div style="padding:0 24px 40px; font-size:28px; font-weight:700; color:var(--primary);">🌟 NovaDEX</div>
        <nav>
            <a href="index.html" class="nav-item">🌟 <span>Top</span></a>
            <a href="trending.html" class="nav-item">🔥 <span>Trending</span></a>
            <a href="#" class="nav-item">🌱 <span>Most Visited</span></a>
            <a href="#" class="nav-item">💰 <span>Prediction Markets</span></a>
            <a href="news.html" class="nav-item">📰 <span>News</span></a>
            <a href="on-chain-data.html" class="nav-item">📊 <span>On-Chain Data</span></a>
            <a href="https://wlgus6464-ui.github.io/NovaDEX01/ETF.html" class="nav-item active">💵 <span>ETF (Exchange Traded Fund)</span></a>
        </nav>
    </aside>

    <div class="main">
        <h1 style="margin:0 0 30px; font-size:1.8rem;">💵 ETF (Exchange Traded Fund)</h1>
        <div class="glass" style="padding:10px;">
            <table>
                <thead>
                    <tr style="color:#aaa;">
                        <th class="sortable" data-sort="rank" data-dir="asc">Coin</th>
                        <th class="sortable" data-sort="price" data-dir="desc">Price</th>
                        <th class="sortable" data-sort="change24h" data-dir="desc">24h %</th>
                        <th class="sortable" data-sort="change7d" data-dir="desc">7D %</th>
                        <th class="sortable" data-sort="marketCap" data-dir="desc">ETF Market Cap</th>
                        <th class="sortable" data-sort="volume" data-dir="desc">ETF Volume (24h)</th>
                    </tr>
                </thead>
                <tbody id="etf-body"></tbody>
            </table>
        </div>
    </div>

    <script src="ETF.js"></script>
    <script src="ETFHOOK.js"></script>
    <script>
        let sortKey = "rank";
        let sortDir = "asc";

        function formatPrice(n) {
            return "$" + Number(n).toLocaleString();
        }

        function formatBillions(n) {
            return "$" + (n / 1e9).toFixed(2) + "B";
        }

        function sortRows(list) {
            list.sort(function(a, b) {
                var av = a[sortKey];
                var bv = b[sortKey];
                if (av < bv) return sortDir === "desc" ? 1 : -1;
                if (av > bv) return sortDir === "desc" ? -1 : 1;
                return 0;
            });
            return list;
        }

        function getSortedList() {
            const data = sortRows((window.etfList || []).slice());
            if (sortKey === "change24h" || sortKey === "change7d" || sortKey === "marketCap" || sortKey === "volume") {
                const hooks = sortRows((window.etfHookList || []).slice()).map(function(h) {
                    var copy = {};
                    for (var k in h) copy[k] = h[k];
                    copy._hook = true;
                    return copy;
                });
                return hooks.concat(data);
            }
            return data;
        }

        function renderEtfTable() {
            const body = document.getElementById("etf-body");
            const data = getSortedList();
            body.innerHTML = "";
            data.forEach(function(item) {
                const cls24 = item.change24h > 0 ? "positive" : (item.change24h < 0 ? "negative" : "");
                const cls7 = item.change7d > 0 ? "positive" : (item.change7d < 0 ? "negative" : "");
                const arrow24 = item.change24h > 0 ? "▲ " : (item.change24h < 0 ? "▼ " : "");
                const arrow7 = item.change7d > 0 ? "▲ " : (item.change7d < 0 ? "▼ " : "");
                const row = document.createElement("tr");
                if (item._hook) {
                    row.style.cursor = "pointer";
                    row.addEventListener("click", function() {
                        window.location.href = "ETFHOOK.html?id=" + encodeURIComponent(item.id || item.symbol);
                    });
                }
                row.innerHTML =
                    '<td class="coin-cell' + (sortKey === "rank" ? " col-active" : "") + '" style="display:flex; align-items:center;">' +
                    '<img src="' + (item.image || "") + '" class="coin-logo" alt="' + (item.name || "") + '">' +
                    '<span style="white-space:nowrap;">' + (item.name || "") + " (" + (item.symbol || "") + ")</span>" +
                    "</td>" +
                    '<td class="' + (sortKey === "price" ? "col-active" : "") + '">' + formatPrice(item.price) + "</td>" +
                    '<td class="' + cls24 + (sortKey === "change24h" ? " col-active" : "") + '">' + arrow24 + item.change24h + "%</td>" +
                    '<td class="' + cls7 + (sortKey === "change7d" ? " col-active" : "") + '">' + arrow7 + item.change7d + "%</td>" +
                    '<td class="' + (sortKey === "marketCap" ? "col-active" : "") + '">' + formatBillions(item.marketCap) + "</td>" +
                    '<td class="' + (sortKey === "volume" ? "col-active" : "") + '">' + formatBillions(item.volume) + "</td>";
                body.appendChild(row);
            });
        }

        document.querySelectorAll("th.sortable").forEach(function(th) {
            th.addEventListener("click", function() {
                sortKey = th.getAttribute("data-sort");
                sortDir = th.getAttribute("data-dir") || "desc";
                document.querySelectorAll("th.sortable").forEach(function(h) {
                    h.classList.remove("active");
                });
                th.classList.add("active");
                renderEtfTable();
            });
        });

        window.onload = function() {
            var first = document.querySelector('th.sortable[data-sort="rank"]');
            if (first) first.classList.add("active");
            renderEtfTable();
        };
    </script>
</body>
</html>
