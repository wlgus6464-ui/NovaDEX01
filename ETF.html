<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaDEX - ETF</title>
    <style>
        :root {
            --bg: #090B11;
            --sidebar: #0F141D;
            --panel: #141B26;
            --border: #232B38;
            --primary: #7CFF6B;
            --danger: #FF5A73;
        }
        body {
            margin: 0;
            background: var(--bg);
            color: white;
            font-family: system-ui, sans-serif;
        }
        .glass {
            background: rgba(20,27,38,0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 18px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 24px;
            color: #aaa;
            text-decoration: none;
            transition: all 0.25s ease;
        }
        .nav-item:hover {
            color: var(--primary);
            background: rgba(124,255,107,0.12);
            transform: translateX(6px);
        }
        .nav-item.active {
            color: var(--primary);
        }
        .main {
            margin-left: 260px;
            padding: 40px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        th, td {
            padding: 16px 12px;
            text-align: left;
            border-bottom: 1px solid #222;
            vertical-align: middle;
        }
        th:nth-child(1), td:nth-child(1) { width: 24%; }
        th:nth-child(2), td:nth-child(2) { width: 14%; }
        th:nth-child(3), td:nth-child(3) { width: 12%; }
        th:nth-child(4), td:nth-child(4) { width: 12%; }
        th:nth-child(5), td:nth-child(5) { width: 19%; }
        th:nth-child(6), td:nth-child(6) { width: 19%; }
        th.sortable {
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }
        th.sortable:hover {
            color: var(--primary);
        }
        th.sortable.active {
            color: var(--primary);
        }
        tr:hover {
            background: rgba(124,255,107,0.08);
        }
        .coin-logo {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            vertical-align: middle;
            margin-right: 12px;
            flex-shrink: 0;
        }
        td.coin-cell {
            white-space: nowrap;
        }
        a.hook-link {
            color: inherit;
            text-decoration: none;
            display: flex;
            align-items: center;
            width: 100%;
            min-height: 28px;
        }
        a.hook-link:hover {
            color: var(--primary);
        }
        tr.hook-row {
            cursor: pointer;
        }
        .mosaic-box {
            display: inline-flex;
            align-items: center;
            filter: blur(10px);
            user-select: none;
            pointer-events: none;
        }
        .mosaic-logo {
            filter: blur(10px);
        }
        .mosaic-name {
            filter: blur(10px);
            user-select: none;
        }
        .positive { color: var(--primary); }
        .negative { color: var(--danger); }
        tbody tr:last-child td { border-bottom: none; }
        td { font-weight: 400; }
        td.col-active { font-weight: 700; }
        .m-tabbar { display: none; }
        @media (max-width: 860px) {
            body { overflow-x: hidden; }
            .sidebar { display: none !important; }
            .main {
                margin-left: 0;
                padding: 16px 14px 96px;
            }
            .page-title {
                font-size: 1.25rem !important;
                margin-bottom: 14px !important;
                line-height: 1.3;
            }
            .glass { border-radius: 14px; }
            table { table-layout: fixed; }
            th, td {
                width: auto !important;
                padding: 8px 2px;
                font-size: 10px;
                word-break: break-word;
                white-space: normal;
            }
            th:nth-child(1), td:nth-child(1) { width: 16% !important; }
            th:nth-child(2), td:nth-child(2) { width: 20% !important; }
            th:nth-child(3), td:nth-child(3) { width: 14% !important; }
            th:nth-child(4), td:nth-child(4) { width: 14% !important; }
            th:nth-child(5), td:nth-child(5) { width: 18% !important; }
            th:nth-child(6), td:nth-child(6) { width: 18% !important; }
            td.coin-cell { display: flex !important; overflow: hidden; }
            .coin-logo { width: 20px; height: 20px; margin-right: 4px; }
            .m-tabbar {
                display: flex;
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 20;
                background: #0F141D;
                border-top: 1px solid #232B38;
                padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
                justify-content: space-around;
            }
            .m-tabbar a {
                flex: 1;
                text-align: center;
                text-decoration: none;
                color: #8B93A1;
                font-size: 11px;
                line-height: 1.25;
            }
            .m-tabbar a span.ico {
                display: block;
                font-size: 18px;
                margin-bottom: 2px;
            }
            .m-tabbar a.on { color: var(--primary); }
        }
    </style>
</head>
<body>
    <aside class="sidebar glass" style="width:260px; position:fixed; height:100vh; background:var(--sidebar); padding:24px 0; border-right:1px solid #333; z-index:10;">
        <div style="padding:0 24px 40px; font-size:28px; font-weight:700; color:var(--primary);">🌟 NovaDEX</div>
        <nav>
            <a href="index.html" class="nav-item">🌟 <span>Top</span></a>
            <a href="trending.html" class="nav-item">🔥 <span>Trending</span></a>
            <a href="#" class="nav-item">🌱 <span>Most Visited</span></a>
            <a href="#" class="nav-item">💰 <span>Prediction Markets</span></a>
            <a href="news.html" class="nav-item">📰 <span>News</span></a>
            <a href="on-chain-data.html" class="nav-item">📊 <span>On-Chain Data</span></a>
            <a href="https://wlgus6464-ui.github.io/NovaDEX01/ETF.html" class="nav-item active">💵 <span>ETF (Exchange Traded Fund)</span></a>
        </nav>
    </aside>

    <div class="main">
        <h1 class="page-title" style="margin:0 0 30px; font-size:1.8rem;">💵 ETF (Exchange Traded Fund)</h1>
        <div class="glass" style="padding:10px;">
            <table>
                <thead>
                    <tr style="color:#aaa;">
                        <th class="sortable" data-sort="rank" data-dir="asc">Coin</th>
                        <th class="sortable" data-sort="price" data-dir="desc">Price</th>
                        <th class="sortable" data-sort="change24h" data-dir="desc">24h %</th>
                        <th class="sortable" data-sort="change7d" data-dir="desc">7D %</th>
                        <th class="sortable" data-sort="marketCap" data-dir="desc">ETF Market Cap</th>
                        <th class="sortable" data-sort="volume" data-dir="desc">ETF Volume (HIGH)</th>
                    </tr>
                </thead>
                <tbody id="etf-body"></tbody>
            </table>
        </div>
    </div>

    <nav class="m-tabbar">
        <a href="index.html"><span class="ico">🌟</span>Top</a>
        <a href="trending.html"><span class="ico">🔥</span>Trending</a>
        <a href="news.html"><span class="ico">📰</span>News</a>
        <a href="on-chain-data.html"><span class="ico">📊</span>On-Chain</a>
        <a href="ETF.html" class="on"><span class="ico">💵</span>ETF</a>
    </nav>

    <script src="ETF.js"></script>
    <script src="ETFHOOK.js"></script>
    <script>
        let sortKey = "rank";
        let sortDir = "asc";

        function formatPrice(n) {
            return "$" + Number(n).toLocaleString();
        }

        function formatBillions(n) {
            n = Number(n) || 0;
            if (Math.abs(n) >= 1e9) return "$" + (n / 1e9).toFixed(2) + "B";
            return "$" + (n / 1e6).toFixed(2) + "M";
        }

        function sortRows(list) {
            list.sort(function(a, b) {
                var av = a[sortKey];
                var bv = b[sortKey];
                if (av < bv) return sortDir === "desc" ? 1 : -1;
                if (av > bv) return sortDir === "desc" ? -1 : 1;
                return 0;
            });
            return list;
        }

        function hookPageUrl(id) {
            return "https://wlgus6464-ui.github.io/NovaDEX01/ETFHOOK.html?id=" + encodeURIComponent(id);
        }

        function hookIdOf(item) {
            if (item && item._hook) return item.id || item.symbol;
            var list = window.etfHookList || [];
            for (var i = 0; i < list.length; i++) {
                if (item && (item.id === list[i].id || item.symbol === list[i].symbol)) return list[i].id;
            }
            return "";
        }

        function getSortedList() {
            const data = (window.etfList || []).slice().filter(function(c) {
                return c.symbol !== "USDT" && c.symbol !== "USDC";
            });
            if (sortKey === "change24h" || sortKey === "change7d" || sortKey === "marketCap" || sortKey === "volume") {
                const hooks = (window.etfHookList || []).slice().map(function(h) {
                    var copy = {};
                    for (var k in h) copy[k] = h[k];
                    copy._hook = true;
                    if (h.etfMarketCap != null) copy.marketCap = h.etfMarketCap;
                    if (h.etfVolume != null) copy.volume = h.etfVolume;
                    return copy;
                });
                return sortRows(hooks.concat(data));
            }
            return sortRows(data);
        }

        function renderEtfTable() {
            const body = document.getElementById("etf-body");
            if (!body) return;
            const data = getSortedList();
            body.innerHTML = "";
            if (!data.length) {
                body.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:40px; color:#888;">ETF.js가 없거나 비어 있습니다. ETF.js를 ETF.html과 같은 폴더에 올려 주세요.</td></tr>';
                return;
            }
            data.forEach(function(item) {
                const cls24 = item.change24h > 0 ? "positive" : (item.change24h < 0 ? "negative" : "");
                const cls7 = item.change7d > 0 ? "positive" : (item.change7d < 0 ? "negative" : "");
                const arrow24 = item.change24h > 0 ? "▲ " : (item.change24h < 0 ? "▼ " : "");
                const arrow7 = item.change7d > 0 ? "▲ " : (item.change7d < 0 ? "▼ " : "");
                const row = document.createElement("tr");
                var hookId = hookIdOf(item);
                var mosaic = !!(item.mosaic || item.id === "hook3" || item.symbol === "HOOK3");
                var coinHtml = '<img src="' + (item.image || "") + '" class="coin-logo" alt="">' +
                    '<span style="white-space:nowrap;">' + (item.name || "") + " (" + (item.symbol || "") + ")</span>";
                if (mosaic) {
                    coinHtml = '<span class="mosaic-box" style="filter:blur(10px);user-select:none;">' + coinHtml + "</span>";
                }
                if (hookId) {
                    var href = hookPageUrl(hookId);
                    row.className = "hook-row";
                    row.setAttribute("data-hook-id", hookId);
                    row.setAttribute("onclick", "window.location.href='" + href.replace(/'/g, "") + "'");
                    coinHtml = '<a class="hook-link" href="' + href + '">' + coinHtml + "</a>";
                }
                row.innerHTML =
                    '<td class="coin-cell' + (sortKey === "rank" ? " col-active" : "") + '" style="display:flex; align-items:center;">' +
                    coinHtml +
                    "</td>" +
                    '<td class="' + (sortKey === "price" ? "col-active" : "") + '">' + formatPrice(item.price) + "</td>" +
                    '<td class="' + cls24 + (sortKey === "change24h" ? " col-active" : "") + '">' + arrow24 + item.change24h + "%</td>" +
                    '<td class="' + cls7 + (sortKey === "change7d" ? " col-active" : "") + '">' + arrow7 + item.change7d + "%</td>" +
                    '<td class="' + (sortKey === "marketCap" ? "col-active" : "") + '">' + formatBillions(item.marketCap) + "</td>" +
                    '<td class="' + (sortKey === "volume" ? "col-active" : "") + '">' + formatBillions(item.volume) + "</td>";
                body.appendChild(row);
            });
        }

        document.querySelectorAll("th.sortable").forEach(function(th) {
            th.addEventListener("click", function() {
                sortKey = th.getAttribute("data-sort");
                sortDir = th.getAttribute("data-dir") || "desc";
                document.querySelectorAll("th.sortable").forEach(function(h) {
                    h.classList.remove("active");
                });
                th.classList.add("active");
                renderEtfTable();
            });
        });

        document.getElementById("etf-body").addEventListener("click", function(e) {
            var tr = e.target.closest("tr[data-hook-id]");
            if (!tr) return;
            e.preventDefault();
            window.location.href = hookPageUrl(tr.getAttribute("data-hook-id"));
        });

        var first = document.querySelector('th.sortable[data-sort="rank"]');
        if (first) first.classList.add("active");
        renderEtfTable();
        window.addEventListener("load", renderEtfTable);
    </script>
</body>
</html>
