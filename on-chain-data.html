<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaDEX - On-Chain Data</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #090B11;
            --sidebar: #0F141D;
            --panel: #141B26;
            --border: #232B38;
            --primary: #7CFF6B;
            --danger: #FF5A73;
            --text-muted: #8b95a8;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .glass {
            background: rgba(20,27,38,0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 18px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 24px;
            color: #aaa;
            text-decoration: none;
            transition: all 0.25s ease;
        }
        .nav-item:hover {
            color: var(--primary);
            background: rgba(124,255,107,0.12);
            transform: translateX(6px);
        }
        .nav-item.active { color: var(--primary); }

        .main-layout {
            display: flex;
            margin-left: 260px;
            min-height: 100vh;
        }
        .metrics-sidebar {
            width: 240px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            padding: 20px 0;
            flex-shrink: 0;
        }
        .metric-category {
            padding: 10px 20px;
            color: #aaa;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .metric-category:hover,
        .metric-category.active {
            color: var(--primary);
            background: rgba(124,255,107,0.08);
        }
        .metric-category.active {
            border-left: 3px solid var(--primary);
        }

        .content-area {
            flex: 1;
            padding: 30px 40px;
        }
        .section-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .asset-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .asset-tab {
            padding: 8px 18px;
            border-radius: 999px;
            background: #1f222b;
            color: #aaa;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .asset-tab.active {
            background: var(--primary);
            color: #000;
            font-weight: 600;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 32px;
        }
        .chart-card {
            background: #11141f;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
        }
        .chart-card h3 {
            margin: 0 0 16px;
            font-size: 1.05rem;
            color: #ddd;
        }
        .chart-wrap {
            position: relative;
            height: 220px;
        }

        .metrics-table {
            width: 100%;
            border-collapse: collapse;
            background: #11141f;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .metrics-table th {
            text-align: left;
            padding: 14px 18px;
            background: #0f141d;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border);
        }
        .metrics-table td {
            padding: 16px 18px;
            border-bottom: 1px solid rgba(35,43,56,0.6);
            vertical-align: middle;
        }
        .metrics-table tr:last-child td { border-bottom: none; }
        .metrics-table tr:hover td {
            background: rgba(124,255,107,0.04);
        }
        .metric-name { font-weight: 600; }
        .metric-desc {
            color: var(--text-muted);
            font-size: 0.88rem;
            max-width: 380px;
            line-height: 1.4;
        }
        .value { font-weight: 600; font-variant-numeric: tabular-nums; }
        .change-up { color: var(--primary); }
        .change-down { color: var(--danger); }

        @media (max-width: 1100px) {
            .charts-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="glass" style="width:260px; position:fixed; height:100vh; background:var(--sidebar); padding:24px 0; border-right:1px solid #333; z-index:10;">
        <div style="padding:0 24px 40px; font-size:28px; font-weight:700; color:var(--primary);">🌟 NovaDEX</div>
        <nav>
            <a href="index.html" class="nav-item">🌟 <span>Top</span></a>
            <a href="trending.html" class="nav-item">🔥 <span>Trending</span></a>
            <a href="#" class="nav-item">🌱 <span>Most Visited</span></a>
            <a href="#" class="nav-item">💰 <span>Prediction Markets</span></a>
            <a href="news.html" class="nav-item">📰 <span>News</span></a>
            <a href="on-chain-data.html" class="nav-item active">📊 <span>On-Chain Data</span></a>
        </nav>
    </aside>

    <div class="main-layout">
        <div class="metrics-sidebar">
            <div style="padding:0 20px 16px; color:#666; font-size:0.8rem;">Metrics</div>
            <div class="metric-category active">Exchange Flows</div>
            <div class="metric-category">Flow Indicator</div>
            <div class="metric-category">Market Indicator</div>
            <div class="metric-category">Network Indicator</div>
            <div class="metric-category">Miner Flows</div>
            <div class="metric-category">Derivatives</div>
        </div>

        <div class="content-area">
            <div class="section-title">Exchange Flows</div>

            <div class="asset-tabs">
                <div class="asset-tab active" data-asset="BTC">BTC</div>
                <div class="asset-tab" data-asset="ETH">ETH</div>
                <div class="asset-tab" data-asset="XRP">XRP</div>
                <div class="asset-tab" data-asset="USDT">USDT</div>
            </div>

            <div class="charts-grid">
                <div class="chart-card">
                    <h3>Exchange Netflow (7D)</h3>
                    <div class="chart-wrap"><canvas id="netflowChart"></canvas></div>
                </div>
                <div class="chart-card">
                    <h3>Exchange Reserve</h3>
                    <div class="chart-wrap"><canvas id="reserveChart"></canvas></div>
                </div>
            </div>

            <table class="metrics-table">
                <thead>
                    <tr>
                        <th>Metric</th>
                        <th>Description</th>
                        <th>Last Value</th>
                        <th>24H (%)</th>
                    </tr>
                </thead>
                <tbody id="metrics-body"></tbody>
            </table>
        </div>
    </div>

    <!-- 반드시 onChainData.js를 먼저 로드 -->
    <script src="onChainData.js"></script>
    <script>
        // onChainData.js가 로드되었는지 확인
        if (typeof window.onChainData === "undefined") {
            document.getElementById("metrics-body").innerHTML = `
                <tr>
                    <td colspan="4" style="text-align:center; padding:40px; color:#FF5A73;">
                        onChainData.js 파일을 찾을 수 없습니다.<br>
                        파일이 같은 폴더에 있는지 확인해주세요.
                    </td>
                </tr>
            `;
            console.error("❌ onChainData.js 로드 실패");
        } else {
            const duneData = window.onChainData;
            let netflowChart, reserveChart;

            function createCharts(asset) {
                const data = duneData[asset];
                if (!data) return;

                if (netflowChart) netflowChart.destroy();
                if (reserveChart) reserveChart.destroy();

                const netCtx = document.getElementById("netflowChart").getContext("2d");
                netflowChart = new Chart(netCtx, {
                    type: "line",
                    data: {
                        labels: data.labels,
                        datasets: [{
                            label: "Netflow (K)",
                            data: data.netflow,
                            borderColor: "#7CFF6B",
                            backgroundColor: "rgba(124,255,107,0.12)",
                            fill: true,
                            tension: 0.35,
                            pointRadius: 3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { ticks: { color: "#8b95a8" }, grid: { color: "rgba(255,255,255,0.04)" } },
                            y: { ticks: { color: "#8b95a8" }, grid: { color: "rgba(255,255,255,0.04)" } }
                        }
                    }
                });

                const resCtx = document.getElementById("reserveChart").getContext("2d");
                reserveChart = new Chart(resCtx, {
                    type: "line",
                    data: {
                        labels: data.labels,
                        datasets: [{
                            label: "Reserve",
                            data: data.reserve,
                            borderColor: "#60a5fa",
                            backgroundColor: "rgba(96,165,250,0.12)",
                            fill: true,
                            tension: 0.35,
                            pointRadius: 3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { ticks: { color: "#8b95a8" }, grid: { color: "rgba(255,255,255,0.04)" } },
                            y: { ticks: { color: "#8b95a8" }, grid: { color: "rgba(255,255,255,0.04)" } }
                        }
                    }
                });
            }

            function renderMetrics(asset) {
                const body = document.getElementById("metrics-body");
                const list = duneData[asset].metrics;
                body.innerHTML = list.map(item => {
                    const cls = item.change > 0 ? "change-up" : (item.change < 0 ? "change-down" : "");
                    const sign = item.change > 0 ? "+" : "";
                    return `
                        <tr>
                            <td class="metric-name">${item.name}</td>
                            <td class="metric-desc">${item.desc}</td>
                            <td class="value">${item.value}</td>
                            <td class="${cls}">${sign}${item.change}%</td>
                        </tr>
                    `;
                }).join("");
            }

            function switchAsset(asset) {
                document.querySelectorAll(".asset-tab").forEach(t => {
                    t.classList.toggle("active", t.dataset.asset === asset);
                });
                createCharts(asset);
                renderMetrics(asset);
            }

            document.querySelectorAll(".asset-tab").forEach(tab => {
                tab.addEventListener("click", () => switchAsset(tab.dataset.asset));
            });

            document.querySelectorAll(".metric-category").forEach(cat => {
                cat.addEventListener("click", () => {
                    document.querySelectorAll(".metric-category").forEach(c => c.classList.remove("active"));
                    cat.classList.add("active");
                });
            });

            // 초기 로드
            switchAsset("BTC");
        }
    </script>
</body>
</html>
