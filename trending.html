<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaDEX - Trending</title>
    <style>
        :root {
            --bg: #090B11;
            --sidebar: #0F141D;
            --panel: #141B26;
            --border: #232B38;
            --primary: #7CFF6B;
            --danger: #FF5A73;
        }
        body {
            margin: 0;
            background: var(--bg);
            color: white;
            font-family: system-ui, sans-serif;
        }
        .glass {
            background: rgba(20,27,38,0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 18px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 24px;
            color: #aaa;
            text-decoration: none;
            transition: all 0.25s ease;
        }
        .nav-item:hover {
            color: var(--primary);
            background: rgba(124,255,107,0.12);
            transform: translateX(6px);
        }
        .nav-item.active {
            color: var(--primary);
        }
        .main {
            margin-left: 260px;
            padding: 40px;
        }
        .pool-card {
            background: #11141f;
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 40px;
            border: 1px solid var(--border);
        }
        .card-content {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        .card-left {
            flex: 1;
            min-width: 280px;
        }
        .card-right {
            flex: 1.2;
            min-width: 300px;
        }
        .coin-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 8px;
        }
        .coin-header img {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            object-fit: cover;
        }
        .coin-title {
            font-size: 1.4rem;
            font-weight: 700;
        }
        .status-ongoing {
            color: var(--primary);
            font-size: 0.9rem;
            font-weight: 600;
        }
        .status-end {
            color: var(--danger);
            font-size: 0.9rem;
            font-weight: 600;
        }
        .prediction-label {
            color: #aaa;
            font-size: 0.9rem;
            margin-top: 18px;
        }
        .prediction-value {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary);
            margin: 4px 0;
        }
        .price-sub {
            color: #888;
            font-size: 0.95rem;
        }
        .date-row {
            margin-top: 20px;
            font-size: 0.95rem;
            line-height: 1.7;
        }
        .progress-track {
            height: 8px;
            background: #2a3140;
            border-radius: 999px;
            margin: 18px 0 16px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            border-radius: 999px;
            width: 0%;
            transition: width 3.5s ease-in-out;
        }
        .countdown {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .countdown-box {
            background: #1a1f2b;
            border-radius: 10px;
            padding: 10px 14px;
            text-align: center;
            min-width: 52px;
        }
        .countdown-box .number {
            font-size: 1.3rem;
            font-weight: 700;
            display: block;
        }
        .countdown-box div:last-child {
            font-size: 0.75rem;
            color: #888;
        }
        .participate-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 999px;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: all 0.25s;
        }
        .participate-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 18px rgba(124,255,107,0.4);
        }
        .banner-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 14px;
            margin-bottom: 16px;
        }
        .banner-text {
            background: #1a1f2b;
            border-radius: 14px;
            padding: 18px 20px;
            font-size: 0.92rem;
            line-height: 1.65;
            color: #ccc;
            max-height: 220px;
            overflow-y: auto;
        }
        @media (max-width: 900px) {
            .main { margin-left: 0; padding: 20px; }
            .card-content { flex-direction: column; }
        }
    </style>
</head>
<body>
    <aside class="glass" style="width:260px; position:fixed; height:100vh; background:var(--sidebar); padding:24px 0; border-right:1px solid #333; z-index:10;">
        <div style="padding:0 24px 40px; font-size:28px; font-weight:700; color:var(--primary);">🌟 NovaDEX</div>
        <nav>
            <a href="index.html" class="nav-item">🌟 <span>Top</span></a>
            <a href="trending.html" class="nav-item active">🔥 <span>Trending</span></a>
            <a href="#" class="nav-item">🌱 <span>Most Visited</span></a>
            <a href="#" class="nav-item">💰 <span>Prediction Markets</span></a>
            <a href="news.html" class="nav-item">📰 <span>News</span></a>
            <a href="on-chain-data.html" class="nav-item">📊 <span>On-Chain Data</span></a>
        </nav>
    </aside>

    <div class="main">
        <h1 style="margin:0 0 30px; font-size:1.8rem;">🔥 Trending Now</h1>
        <div id="trending-container"></div>
    </div>

    <script src="trendingData.js"></script>
    <script>
        function getDateColor(dateStr) {
            const now = new Date();
            const d = new Date(dateStr);
            if (d < now) return 'var(--danger)';
            return 'var(--primary)';
        }

        function startCountdown(id, endDate) {
            const end = new Date(endDate).getTime();
            setInterval(() => {
                const now = new Date().getTime();
                const distance = end - now;
                const el = document.getElementById(id);
                if (!el) return;
                if (distance < 0) {
                    el.innerHTML = `
                        <div class="countdown-box"><span class="number">0</span><div>D</div></div>
                        <div class="countdown-box"><span class="number">0</span><div>H</div></div>
                        <div class="countdown-box"><span class="number">0</span><div>M</div></div>
                        <div class="countdown-box"><span class="number">0</span><div>S</div></div>
                    `;
                    return;
                }
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                el.innerHTML = `
                    <div class="countdown-box"><span class="number">${days}</span><div>D</div></div>
                    <div class="countdown-box"><span class="number">${hours}</span><div>H</div></div>
                    <div class="countdown-box"><span class="number">${minutes}</span><div>M</div></div>
                    <div class="countdown-box"><span class="number">${seconds}</span><div>S</div></div>
                `;
            }, 1000);
        }

        function renderTrending() {
            const container = document.getElementById('trending-container');
            const data = window.trendingData || [];
            if (!data.length) {
                container.innerHTML = '<div style="color:#888; padding:40px;">trendingData.js를 확인해주세요</div>';
                return;
            }

            container.innerHTML = '';
            data.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'pool-card';

                // 상태 텍스트
                let statusHtml = '';
                if (index === 0 || index === 1) {
                    statusHtml = '<div class="status-end">End</div>';
                } else if (index === 3) {
                    statusHtml = '<div class="status-ongoing" style="color:#888;">COMING SOON</div>';
                } else {
                    statusHtml = '<div class="status-ongoing">Ongoing</div>';
                }

                card.innerHTML = `
                    <div class="card-content">
                        <div class="card-left">
                            <div class="coin-header">
                                <img src="${item.img}" alt="${item.title}">
                                <div>
                                    <div class="coin-title">${item.title}</div>
                                    ${statusHtml}
                                </div>
                            </div>
                            <div class="prediction-label">Upward Prediction</div>
                            <div class="prediction-value">${item.prediction}</div>
                            <div class="price-sub">≈ ${item.price} USDT</div>
                            <div class="date-row">
                                <div>Start In <span style="color:${getDateColor(item.startDate)}">${item.startDate.slice(0,10)}</span></div>
                                <div>Ends In <span style="color:${getDateColor(item.endDate)}">${item.endDate.slice(0,10)}</span></div>
                            </div>
                            <div class="progress-track">
                                <div class="progress-bar" id="progress${index}"></div>
                            </div>
                            <div class="countdown" id="countdown${index}"></div>
                            <a class="participate-btn" href="${item.participateLink}" target="_blank" rel="noopener">Participate</a>
                        </div>
                        <div class="card-right">
                            <img class="banner-img" src="${item.bannerImage}" alt="banner">
                            <div class="banner-text">${item.bannerText}</div>
                        </div>
                    </div>
                `;
                container.appendChild(card);

                const progressBar = document.getElementById(`progress${index}`);

                if (index === 0 || index === 1) {
                    // 1, 2번째 → 초록색 꽉 찬 바
                    progressBar.style.background = 'var(--primary)';
                    progressBar.style.width = '100%';
                              } else if (index === 2) {
                    // Pharos → 황금 바 + 끝 빛, 25~30% 천천히 랜덤
                    progressBar.classList.add('gold-glow');
                    let current = 27.5;
                    progressBar.style.width = current + '%';
                    progressBar.style.transition = 'width 3.8s ease-in-out';
                    setInterval(() => {
                        current = 25 + Math.random() * 5;
                        progressBar.style.width = current + '%';
                    }, 4200);
                } else if (index === 3) {
                    // COMING SOON → 0% 회색
                    progressBar.style.background = '#3a4150';
                    progressBar.style.width = '0%';
                } else {
                    progressBar.style.background = 'linear-gradient(90deg, #f5c542, #ffd700)';
                    progressBar.style.width = '70%';
                }

                startCountdown(`countdown${index}`, item.endDate);
            });
        }

        // 날짜 색상 주기적 갱신
        setInterval(() => {
            const cards = document.querySelectorAll('.pool-card');
            cards.forEach((card, idx) => {
                const item = (window.trendingData || [])[idx];
                if (!item) return;
                const spans = card.querySelectorAll('.date-row span');
                if (spans[0]) spans[0].style.color = getDateColor(item.startDate);
                if (spans[1]) spans[1].style.color = getDateColor(item.endDate);
            });
        }, 60000);

        window.onload = renderTrending;
    </script>
</body>
</html>
